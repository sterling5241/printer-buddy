name: grab part releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Copy each part's existing releases into this repo as <part>-<tag>
        run: |
          for part in ui notify timelapse streamer; do
            src="sterling5241/print-buddy-$part"
            for tag in $(gh release list --repo "$src" --exclude-pre-releases --limit 50 --json tagName -q '.[].tagName' 2>/dev/null); do
              dst="$part-$tag"
              if gh release view "$dst" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                continue
              fi
              echo "$src $tag -> $dst"
              rm -rf dl && mkdir dl
              gh release download "$tag" --repo "$src" --dir dl
              gh release create "$dst" dl/* --repo "$GITHUB_REPOSITORY" --latest=false --title "$part $tag"
            done
          done
