name: updates list

on:
  release:
    types: [published, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rebuild updates.txt from every release
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > releases.json
          python3 - <<'PY'
          import json, re
          best = {}
          for r in json.load(open("releases.json")):
              tag = r["tag_name"]
              if r.get("draft"):
                  continue
              if m := re.fullmatch(r"ai-([a-z]+)-(v[\d.]+)", tag):
                  key, ver, when = ("ai", m[1]), m[2], r["published_at"]
              elif m := re.fullmatch(r"([a-z]+)-nightly", tag):
                  key, ver, when = (m[1], "nightly"), r["published_at"][:10], r["published_at"]
              elif m := re.fullmatch(r"([a-z]+)-(v[\d.]+)", tag):
                  key, ver, when = (m[1], "stable"), m[2], r["published_at"]
              else:
                  continue
              nums = [int(x) for x in re.findall(r"\d+", ver)]
              if key not in best or (nums, when) > best[key][0]:
                  best[key] = ((nums, when), ver, tag, r.get("body") or "")
          lines = sorted(f"{a} {b} {v}" for (a, b), (_, v, _, _) in best.items())
          for _, _, tag, body in sorted(best.values(), key=lambda x: x[2]):
              need = next((l.split(":", 1)[1] for l in body.splitlines() if l.lower().startswith("needs:")), "")
              lines += [f"needs {tag} {i.split()[0]} {i.split()[1]}" for i in need.split(",") if len(i.split()) == 2]
          open("updates.txt", "w").write("\n".join(lines) + "\n")
          PY
          rm releases.json
          cat updates.txt
          gh release view updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create updates --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
                 --title "Update list" --notes "updates.txt for Printer Buddy's Components page. Rebuilt by the updates list workflow."
          gh release upload updates updates.txt --repo "$GITHUB_REPOSITORY" --clobber
