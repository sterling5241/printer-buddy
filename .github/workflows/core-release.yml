name: core release

on:
  push:
    tags: ["core-v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        run: |
          notes="Core $GITHUB_REF_NAME ($GITHUB_SHA). Stable installs follow the builds branch."
          needs="$(grep -v '^\s*#' needs.txt 2>/dev/null | grep . | paste -sd, - | sed 's/,/, /g' || true)"
          [ -n "$needs" ] && notes="$notes"$'\n\n'"needs: $needs"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Printer Buddy ${GITHUB_REF_NAME#core-}" --notes "$notes"

      # releases made with github.token don't start other workflows, so start updates list here
      - name: Update updates.txt
        run: gh workflow run updates-list.yml --repo "$GITHUB_REPOSITORY"
