name: ai stats

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose notes get the results (e.g. ai-basic-v1.5); empty = only post to Discord
        required: false

permissions:
  contents: write

jobs:
  stats:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ai-')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sterling5241/printer-buddy-ai
          token: ${{ secrets.AI_REPO_TOKEN }}

      - name: Get the test set
        env:
          GH_TOKEN: ${{ secrets.AI_REPO_TOKEN }}
        run: |
          ref=$(gh release list --repo sterling5241/printer-buddy-ai --limit 100 --json tagName -q '[.[].tagName | select(startswith("ref-"))][0]')
          gh release download "$ref" --repo sterling5241/printer-buddy-ai --pattern ref.zip
          unzip -q ref.zip && rm ref.zip
          echo "test set: $ref ($(tail -n +2 ref/labels.csv | wc -l) photos)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test lite, basic and heavy
        run: |
          pip install -q numpy pillow onnxruntime
          python stats.py --model all --release | tee out.txt
          sed -n '/----- Discord (copy below) -----/,$p' out.txt | tail -n +2 > post.md

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_AI_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "no DISCORD_AI_WEBHOOK secret, skipped"; exit 0; }
          python3 -c 'import json; print(json.dumps({"content": open("post.md").read()}))' > body.json
          curl -sf -H "Content-Type: application/json" -d @body.json "$WEBHOOK"

      - name: Add the results to the release notes
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          { echo; echo "## Model check"; cat post.md; } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
